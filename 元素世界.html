<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 元素世界</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    overflow: hidden;
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    user-select: none;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ---- 顶部工具栏 ---- */
  #toolbar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 20px;
    background: linear-gradient(180deg, #1a1a3e 0%, #12122a 100%);
    border-bottom: 2px solid #2a2a5a;
    flex-shrink: 0;
    flex-wrap: wrap;
    z-index: 10;
  }
  #toolbar h1 {
    color: #fff;
    font-size: 22px;
    margin-right: 16px;
    text-shadow: 0 0 12px rgba(100,200,255,0.5);
    letter-spacing: 2px;
  }

  .elem-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 8px 14px;
    border: 2px solid transparent;
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    cursor: pointer;
    transition: all 0.2s;
    min-width: 68px;
  }
  .elem-btn:hover { background: rgba(255,255,255,0.12); }
  .elem-btn.active {
    border-color: #fff;
    background: rgba(255,255,255,0.18);
    box-shadow: 0 0 14px rgba(255,255,255,0.25);
  }
  .elem-icon { font-size: 28px; line-height: 1; }
  .elem-label { color: #ccc; font-size: 12px; }

  .tool-sep {
    width: 1px;
    height: 36px;
    background: #3a3a6a;
    margin: 0 6px;
  }

  .tool-btn {
    padding: 8px 16px;
    border: 2px solid #555;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
    color: #ccc;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  .tool-btn:hover { background: rgba(255,80,80,0.2); border-color: #f66; color: #fff; }

  #brush-size-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #aaa;
    font-size: 13px;
  }
  #brush-size {
    width: 80px;
    accent-color: #6af;
  }

  /* ---- 画布区域 ---- */
  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: crosshair;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
  }

  /* ---- 星空背景 ---- */
  #stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  /* ---- 水印提示 ---- */
  #hint {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.25);
    font-size: 14px;
    pointer-events: none;
    z-index: 5;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>

<!-- 工具栏 -->
<div id="toolbar">
  <h1>🌍 元素世界</h1>

  <div class="elem-btn active" data-elem="sand">
    <span class="elem-icon">🟤</span><span class="elem-label">沙子</span>
  </div>
  <div class="elem-btn" data-elem="water">
    <span class="elem-icon">💧</span><span class="elem-label">水</span>
  </div>
  <div class="elem-btn" data-elem="fire">
    <span class="elem-icon">🔥</span><span class="elem-label">火</span>
  </div>
  <div class="elem-btn" data-elem="wood">
    <span class="elem-icon">🪵</span><span class="elem-label">木头</span>
  </div>
  <div class="elem-btn" data-elem="oil">
    <span class="elem-icon">🛢️</span><span class="elem-label">油</span>
  </div>
  <div class="elem-btn" data-elem="stone">
    <span class="elem-icon">🪨</span><span class="elem-label">石头</span>
  </div>

  <div class="tool-sep"></div>

  <div id="brush-size-wrap">
    <span>🖌️</span>
    <input type="range" id="brush-size" min="1" max="8" value="3">
    <span id="brush-label">3</span>
  </div>

  <div class="tool-sep"></div>

  <button class="tool-btn" id="btn-clear">🗑️ 清空</button>
</div>

<!-- 画布 -->
<div id="canvas-wrap">
  <canvas id="stars"></canvas>
  <canvas id="c"></canvas>
  <div id="hint">👆 按住鼠标画元素 | ⬅️➡️ 方向键控制火柴人 | ⬆️ 跳跃</div>
</div>

<script>
/* ======================================================
   元素世界 — 粒子物理模拟
   ====================================================== */

// ---------- 初始化 ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const starsCanvas = document.getElementById('stars');
const starsCtx = starsCanvas.getContext('2d');

let W, H;
const CELL = 4;
let cols, rows;
let grid;

function resize() {
  W = window.innerWidth || 800;
  H = window.innerHeight - document.getElementById('toolbar').offsetHeight || 600;
  canvas.width = W; canvas.height = H;
  starsCanvas.width = W; starsCanvas.height = H;
  cols = Math.ceil(W / CELL);
  rows = Math.ceil(H / CELL);
  initGrid();
  drawStars();
}

function initGrid() {
  grid = [];
  for (let c = 0; c < cols; c++) {
    grid[c] = [];
    for (let r = 0; r < rows; r++) {
      grid[c][r] = null;
    }
  }
}

// ---------- 星空背景 ----------
function drawStars() {
  starsCtx.fillStyle = '#0a0a1a';
  starsCtx.fillRect(0, 0, W, H);
  for (let i = 0; i < 200; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const size = Math.random() * 1.8 + 0.3;
    const alpha = Math.random() * 0.6 + 0.3;
    starsCtx.beginPath();
    starsCtx.arc(x, y, size, 0, Math.PI * 2);
    starsCtx.fillStyle = `rgba(200,220,255,${alpha})`;
    starsCtx.fill();
  }
}

// ---------- 元素定义 ----------
const ELEM = {
  sand:   { r: 210, g: 180, b: 110, density: 3, fluid: 0.15, life: Infinity },
  water:  { r: 40,  g: 140, b: 255, density: 2, fluid: 0.8,  life: Infinity },
  fire:   { r: 255, g: 100, b: 30,  density: -1, fluid: 0.6, life: 120 },
  wood:   { r: 120, g: 80,  b: 30,  density: 0,  fluid: 0,   life: Infinity, burnable: true },
  oil:    { r: 60,  g: 50,  b: 30,  density: 2.1, fluid: 0.9, life: Infinity, burnable: true },
  stone:  { r: 140, g: 140, b: 140, density: 0,  fluid: 0,   life: Infinity },
};

function makeParticle(type) {
  const e = ELEM[type];
  return {
    type,
    r: e.r + (Math.random() - 0.5) * 20,
    g: e.g + (Math.random() - 0.5) * 20,
    b: e.b + (Math.random() - 0.5) * 20,
    density: e.density,
    fluid: e.fluid,
    life: e.life === Infinity ? Infinity : e.life + Math.floor(Math.random() * 40),
    updated: false,
    burnable: e.burnable || false,
  };
}

// ---------- 工具状态 ----------
let currentElem = 'sand';
let brushSize = 3;
let mouseDown = false;
let lastMx = -1, lastMy = -1;

// ---------- 工具栏交互 ----------
document.querySelectorAll('.elem-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelector('.elem-btn.active')?.classList.remove('active');
    btn.classList.add('active');
    currentElem = btn.dataset.elem;
  });
});

document.getElementById('brush-size').addEventListener('input', e => {
  brushSize = parseInt(e.target.value);
  document.getElementById('brush-label').textContent = brushSize;
});

document.getElementById('btn-clear').addEventListener('click', initGrid);

// ---------- 绘制 ----------
function paint(cx, cy) {
  const r = brushSize;
  for (let dx = -r; dx <= r; dx++) {
    for (let dy = -r; dy <= r; dy++) {
      if (dx * dx + dy * dy > r * r) continue;
      const c = cx + dx;
      const rr = cy + dy;
      if (c < 0 || c >= cols || rr < 0 || rr >= rows) continue;
      if (grid[c][rr] === null) {
        grid[c][rr] = makeParticle(currentElem);
      }
    }
  }
}

function paintLine(x0, y0, x1, y1) {
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const steps = Math.max(dx, dy, 1);
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const x = Math.round(x0 + (x1 - x0) * t);
    const y = Math.round(y0 + (y1 - y0) * t);
    paint(x, y);
  }
}

// ---------- 鼠标事件 ----------
const wrap = document.getElementById('canvas-wrap');

wrap.addEventListener('mousedown', e => {
  mouseDown = true;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const cx = Math.floor(mx / CELL), cy = Math.floor(my / CELL);
  paint(cx, cy);
  lastMx = cx; lastMy = cy;
});

wrap.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const cx = Math.floor(mx / CELL), cy = Math.floor(my / CELL);
  if (mouseDown) {
    if (lastMx >= 0) paintLine(lastMx, lastMy, cx, cy);
    else paint(cx, cy);
  }
  lastMx = cx; lastMy = cy;
});

wrap.addEventListener('mouseup', () => { mouseDown = false; lastMx = -1; lastMy = -1; });
wrap.addEventListener('mouseleave', () => { mouseDown = false; lastMx = -1; lastMy = -1; });

// 触摸支持
wrap.addEventListener('touchstart', e => {
  e.preventDefault();
  mouseDown = true;
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const cx = Math.floor((t.clientX - rect.left) / CELL);
  const cy = Math.floor((t.clientY - rect.top) / CELL);
  paint(cx, cy);
  lastMx = cx; lastMy = cy;
}, { passive: false });

wrap.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const cx = Math.floor((t.clientX - rect.left) / CELL);
  const cy = Math.floor((t.clientY - rect.top) / CELL);
  if (lastMx >= 0) paintLine(lastMx, lastMy, cx, cy);
  lastMx = cx; lastMy = cy;
}, { passive: false });

wrap.addEventListener('touchend', () => { mouseDown = false; lastMx = -1; lastMy = -1; });

// ---------- 物理模拟 ----------
function inBounds(c, r) { return c >= 0 && c < cols && r >= 0 && r < rows; }
function get(c, r) { return inBounds(c, r) ? grid[c][r] : undefined; }
function set(c, r, p) { if (inBounds(c, r)) grid[c][r] = p; }

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function simulate() {
  // 重置所有 updated 标记，让粒子每帧都能移动
  for (let c = 0; c < cols; c++) {
    for (let r = 0; r < rows; r++) {
      if (grid[c][r]) grid[c][r].updated = false;
    }
  }

  const leftToRight = (Math.random() > 0.5);

  for (let r = rows - 1; r >= 0; r--) {
    const colOrder = [];
    for (let c = 0; c < cols; c++) colOrder.push(c);
    if (leftToRight) colOrder.reverse();
    shuffle(colOrder);

    for (const c of colOrder) {
      const p = get(c, r);
      if (!p || p.updated) continue;

      // --- 火 ---
      if (p.type === 'fire') {
        p.life--;
        if (p.life <= 0) { set(c, r, null); continue; }

        // 检查周围有没有水→被浇灭
        let nearWater = false;
        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            const nb = get(c + dx, r + dy);
            if (nb && nb.type === 'water') { nearWater = true; break; }
          }
          if (nearWater) break;
        }
        if (nearWater) {
          set(c, r, { type: 'steam', r: 200, g: 200, b: 210, density: -1, fluid: 0.4, life: 40, updated: false, burnable: false });
          continue;
        }

        // 火焰颜色闪烁：核心亮黄→边缘暗红
        const lifeRatio = p.life / 120;
        p.r = 255;
        p.g = 40 + Math.floor(lifeRatio * 120 + Math.random() * 40);
        p.b = Math.floor(Math.random() * 15);

        // 向上飘：先试正上方，再试左上/右上
        const tryDirs = [0, -1, 1];
        const dy = -1;
        for (const dx of tryDirs) {
          if (get(c + dx, r + dy) === null) {
            set(c, r, null);
            set(c + dx, r + dy, p);
            p.updated = true;
            break;
          }
        }
        continue;
      }

      // --- 火焰粒子（木头燃烧时产生） ---
      if (p.type === 'flame') {
        p.life--;
        if (p.life <= 0) { set(c, r, null); continue; }

        // 检查周围有没有水→被浇灭
        let nearWater = false;
        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            const nb = get(c + dx, r + dy);
            if (nb && nb.type === 'water') { nearWater = true; break; }
          }
          if (nearWater) break;
        }
        if (nearWater) {
          set(c, r, { type: 'steam', r: 200, g: 200, b: 210, density: -1, fluid: 0.4, life: 40, updated: false, burnable: false });
          continue;
        }

        p.r = 255;
        p.g = 50 + Math.floor(Math.random() * 100);
        p.b = Math.floor(Math.random() * 20);

        const dy2 = -1;
        const dx2 = Math.random() > 0.5 ? 1 : -1;
        if (get(c + dx2, r + dy2) === null) {
          set(c, r, null);
          set(c + dx2, r + dy2, p);
          p.updated = true;
        }
        continue;
      }

      // --- 蒸汽（火被水浇灭后产生） ---
      if (p.type === 'steam') {
        p.life--;
        if (p.life <= 0) { set(c, r, null); continue; }
        // 蒸汽慢慢变透明（变淡）
        p.g = Math.min(210, p.g + 1);
        p.b = Math.min(220, p.b + 1);
        // 向上飘
        const dx3 = Math.random() > 0.5 ? 1 : -1;
        if (get(c + dx3, r - 1) === null) {
          set(c, r, null);
          set(c + dx3, r - 1, p);
          p.updated = true;
        }
        continue;
      }

      // --- 木头 / 油 燃烧逻辑 ---
      if (p.burnable) {
        let ignite = false;
        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            const nb = get(c + dx, r + dy);
            if (nb && (nb.type === 'fire' || nb.type === 'flame')) { ignite = true; break; }
          }
          if (ignite) break;
        }
        if (ignite) {
          // 在木头位置生成火焰粒子（有燃烧特效）
          set(c, r, {
            type: 'flame',
            r: 255, g: 180, b: 30,
            density: -1, fluid: 0,
            life: 80 + Math.floor(Math.random() * 40),
            updated: false,
            burnable: false,
          });
          // 在周围随机位置也生成 1-2 个小火焰粒子
          for (let i = 0; i < 1 + Math.floor(Math.random() * 2); i++) {
            const fx = c + Math.floor(Math.random() * 3) - 1;
            const fy = r + Math.floor(Math.random() * 2) - 1;
            if (inBounds(fx, fy) && !get(fx, fy)) {
              set(fx, fy, {
                type: 'flame',
                r: 255, g: 150 + Math.floor(Math.random() * 60), b: 10,
                density: -1, fluid: 0,
                life: 50 + Math.floor(Math.random() * 30),
                updated: false, burnable: false,
              });
            }
          }
          continue;
        }
        if (p.type === 'oil' && p.fluid > 0) {
          // 油会流动
        } else {
          continue;
        }
      }

      // --- 石头：不动 ---
      if (p.type === 'stone') continue;

      const below = get(c, r + 1);
      const belowL = get(c - 1, r + 1);
      const belowR = get(c + 1, r + 1);

      const isPowder = (p.type === 'sand');
      const isLiquid = (p.type === 'water' || p.type === 'oil');

      if (isPowder || isLiquid) {
        // 1. 尝试向下
        if (below === null) {
          set(c, r, null);
          set(c, r + 1, p);
          p.updated = true;
          continue;
        }
        // 2. 向下斜方
        const dirs = (Math.random() > 0.5) ? [belowR, belowL] : [belowL, belowR];
        const dc = dirs[0] === belowL ? -1 : 1;
        const dc2 = dirs[1] === belowL ? -1 : 1;

        if (dirs[0] === null) {
          set(c, r, null);
          set(c + dc, r + 1, p);
          p.updated = true;
          continue;
        }
        if (dirs[1] === null) {
          set(c, r, null);
          set(c + dc2, r + 1, p);
          p.updated = true;
          continue;
        }

        // 3. 液体水平流动
        if (isLiquid && p.fluid > 0) {
          const spread = Math.floor(p.fluid * 3) + 1;
          for (let s = 1; s <= spread; s++) {
            const tryDirs = (Math.random() > 0.5) ? [1, -1] : [-1, 1];
            for (const d of tryDirs) {
              if (get(c + d * s, r) === null) {
                set(c, r, null);
                set(c + d * s, r, p);
                p.updated = true;
                break;
              }
            }
            if (p.updated) break;
          }
        }
      }
    }
  }
}

// ---------- 火柴人 ----------
const stick = {
  x: 200, y: 200,        // 像素坐标
  vx: 0, vy: 0,          // 速度
  onGround: false,        // 是否踩在地上
  facing: 1,              // 1=右 -1=左
  walkFrame: 0,           // 行走动画帧
  health: 100,            // 生命值
  alive: true,
};

const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  // 阻止方向键滚动页面
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

function updateStick() {
  if (!stick.alive) return;

  const GRAVITY = 0.6;
  const SPEED = 3;
  const JUMP = -10;

  // 每帧检查脚下是否有支撑（防止onGround丢失）
  const footCheckL = Math.floor((stick.x - 12) / CELL);
  const footCheckR = Math.floor((stick.x + 12) / CELL);
  const footCheckY = Math.floor((stick.y + 7) / CELL);
  stick.onGround = false;
  for (const tx of [footCheckL, footCheckR]) {
    if (inBounds(tx, footCheckY) && grid[tx][footCheckY] && grid[tx][footCheckY].type !== 'water' && grid[tx][footCheckY].type !== 'steam') {
      stick.onGround = true;
      break;
    }
  }

  // 左右移动
  if (keys['ArrowLeft']) { stick.vx = -SPEED; stick.facing = -1; }
  else if (keys['ArrowRight']) { stick.vx = SPEED; stick.facing = 1; }
  else { stick.vx *= 0.7; }

  // 跳跃：只要脚下有东西就能跳，或者在下落时也能跳一次
  const canJump = stick.onGround || (stick.vy >= 0 && stick.vy < 3);
  if (keys['ArrowUp'] && canJump) {
    stick.vy = JUMP;
    stick.onGround = false;
  }

  // 重力
  stick.vy += GRAVITY;

  // 水中阻力
  const scx = Math.floor(stick.x / CELL);
  const scy = Math.floor(stick.y / CELL);
  if (inBounds(scx, scy) && grid[scx][scy] && grid[scx][scy].type === 'water') {
    stick.vy *= 0.6;
    stick.vx *= 0.8;
  }

  // 移动 + 碰撞检测

  // 水平（火柴人3倍大，碰撞箱也放大）
  const newX = stick.x + stick.vx;
  const footL = Math.floor((newX - 18) / CELL);
  const footR = Math.floor((newX + 18) / CELL);
  const headY = Math.floor((stick.y - 42) / CELL);
  const footY = Math.floor((stick.y + 6) / CELL);

  let canMoveX = true;
  for (let ty = headY; ty <= footY; ty++) {
    for (const tx of [footL, footR]) {
      if (inBounds(tx, ty) && grid[tx][ty] && grid[tx][ty].type !== 'water' && grid[tx][ty].type !== 'steam') {
        canMoveX = false;
      }
    }
  }
  if (canMoveX) stick.x = newX;

  // 垂直（碰撞箱放大）
  const newY = stick.y + stick.vy;
  const checkL = Math.floor((stick.x - 18) / CELL);
  const checkR = Math.floor((stick.x + 18) / CELL);

  if (stick.vy > 0) {
    // 下落：检测脚下
    const newFoot = Math.floor((newY + 6) / CELL);
    let blocked = false;
    for (const tx of [checkL, checkR]) {
      if (inBounds(tx, newFoot) && grid[tx][newFoot] && grid[tx][newFoot].type !== 'water' && grid[tx][newFoot].type !== 'steam') {
        blocked = true;
      }
    }
    if (blocked) {
      stick.y = newFoot * CELL - 6;
      stick.vy = 0;
      stick.onGround = true;
    } else {
      stick.y = newY;
    }
  } else if (stick.vy < 0) {
    // 上升：检测头顶
    const newHead = Math.floor((newY - 42) / CELL);
    let blocked = false;
    for (const tx of [checkL, checkR]) {
      if (inBounds(tx, newHead) && grid[tx][newHead] && grid[tx][newHead].type !== 'water' && grid[tx][newHead].type !== 'steam') {
        blocked = true;
      }
    }
    if (blocked) {
      stick.vy = 0;
    } else {
      stick.y = newY;
    }
  }

  // 边界
  stick.x = Math.max(20, Math.min(W - 20, stick.x));
  stick.y = Math.max(50, Math.min(H - 10, stick.y));

  // 行走动画
  if (Math.abs(stick.vx) > 0.5) stick.walkFrame += 0.2;

  // 接触火/火焰粒子→掉血（检测范围加大）
  for (let dx = -2; dx <= 2; dx++) {
    for (let dy = -2; dy <= 2; dy++) {
      const nb = get(Math.floor(stick.x / CELL) + dx, Math.floor(stick.y / CELL) + dy);
      if (nb && (nb.type === 'fire' || nb.type === 'flame')) {
        stick.health -= 0.5;
        if (stick.health <= 0) { stick.alive = false; }
      }
    }
  }
}

function drawStick() {
  if (!stick.alive) return;
  ctx.save();
  ctx.translate(stick.x, stick.y);
  ctx.scale(stick.facing * 3, 3);

  // 行走时腿部动画
  const legAngle = Math.sin(stick.walkFrame) * 0.5;
  const armAngle = Math.sin(stick.walkFrame + Math.PI) * 0.4;

  // 生命值低时身体变红
  const hpRatio = Math.max(0, stick.health / 100);
  const bodyColor = `rgb(${255 - Math.floor(hpRatio * 55)}, ${Math.floor(hpRatio * 220)}, ${Math.floor(hpRatio * 100)})`;

  ctx.strokeStyle = bodyColor;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';

  // 头
  ctx.beginPath();
  ctx.arc(0, -14, 5, 0, Math.PI * 2);
  ctx.stroke();

  // 眼睛
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.arc(2, -14, 1.2, 0, Math.PI * 2);
  ctx.fill();

  // 身体
  ctx.beginPath();
  ctx.moveTo(0, -9);
  ctx.lineTo(0, 0);
  ctx.stroke();

  // 左臂
  ctx.beginPath();
  ctx.moveTo(0, -7);
  ctx.lineTo(-6 * Math.cos(armAngle), -2 + 6 * Math.sin(armAngle));
  ctx.stroke();

  // 右臂
  ctx.beginPath();
  ctx.moveTo(0, -7);
  ctx.lineTo(6 * Math.cos(armAngle), -2 - 6 * Math.sin(armAngle));
  ctx.stroke();

  // 左腿
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-4 * Math.cos(legAngle), 8 + 4 * Math.abs(Math.sin(legAngle)));
  ctx.stroke();

  // 右腿
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(4 * Math.cos(legAngle), 8 - 4 * Math.abs(Math.sin(legAngle)));
  ctx.stroke();

  ctx.restore();
}

// ---------- 渲染 ----------
function render() {
  const img = ctx.createImageData(W, H);
  const data = img.data;

  for (let c = 0; c < cols; c++) {
    for (let r = 0; r < rows; r++) {
      const p = grid[c][r];
      if (!p) continue;

      let red = p.r, green = p.g, blue = p.b;

      if (p.type === 'fire') {
        const glow = 0.7 + Math.random() * 0.3;
        red = Math.min(255, red * glow + 80);
        green = Math.min(255, green * glow + 20);
        blue = Math.min(255, blue * glow);
      }

      if (p.type === 'flame') {
        const glow = 0.8 + Math.random() * 0.2;
        red = Math.min(255, red * glow + 60);
        green = Math.min(255, green * glow + 30);
        blue = Math.min(255, blue * glow);
      }

      if (p.type === 'stone') {
        const noise = Math.random() * 20 - 10;
        red += noise; green += noise; blue += noise;
      }

      const px = c * CELL, py = r * CELL;
      const r2 = Math.max(0, Math.min(255, Math.round(red)));
      const g2 = Math.max(0, Math.min(255, Math.round(green)));
      const b2 = Math.max(0, Math.min(255, Math.round(blue)));

      for (let dx = 0; dx < CELL; dx++) {
        for (let dy = 0; dy < CELL; dy++) {
          const idx = ((py + dy) * W + (px + dx)) * 4;
          if (idx + 3 >= data.length) continue;
          data[idx] = r2;
          data[idx + 1] = g2;
          data[idx + 2] = b2;
          data[idx + 3] = 255;
        }
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

// ---------- 主循环 ----------
function loop() {
  simulate();
  updateStick();
  render();
  drawStick();
  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
resize();
loop();

setTimeout(() => {
  const hint = document.getElementById('hint');
  if (hint) { hint.style.transition = 'opacity 1s'; hint.style.opacity = '0'; }
}, 5000);
</script>
</body>
